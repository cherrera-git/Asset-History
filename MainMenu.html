<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #eef2f3;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .menu-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 90%;
            max-width: 360px;
        }

        .header-title {
            margin: 0 0 10px 0;
            font-size: 22px;
            font-weight: 600;
            color: #1a252f;
            text-align: center;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        /* Base Button Design */
        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 !important;
            padding: 18px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Distinct Category Gradients */
        .borrow-btn {
            background-image: linear-gradient(to right, #43e97b 0%, #38f9d7 100%);
            color: #0d3c26;
        }
        .borrow-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .return-btn {
            background-image: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: #053c5e;
        }
        .return-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .find-btn {
            background-image: linear-gradient(to right, #f8c76b 0%, #f79d57 100%);
            color: #4d2800;
        }
        .find-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        #message {
            display: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            background-color: #f8d7da;
            color: #58151c;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="menu-wrapper">
        <h2 class="header-title">Asset Management</h2>
        
        <div id="buttonContainer" class="button-container">
            <button class="borrow-btn" onclick="openDialog(this, 'showBorrowDialog')">
                <span>📦</span> Borrow Asset
            </button>
            <button class="return-btn" onclick="openDialog(this, 'showReturnDialog')">
                <span>🔄</span> Return Asset
            </button>
            <button class="find-btn" onclick="openDialog(this, 'showFindDialog')">
                <span>🔍</span> Find Asset
            </button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        function openDialog(button, functionName) {
            var messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';

            var buttons = document.querySelectorAll('#buttonContainer button');
            buttons.forEach(function(btn) {
                btn.disabled = true;
            });
            
            var originalText = button.innerHTML;
            button.innerHTML = '<span>⏳</span> Loading...';

            google.script.run
                .withSuccessHandler(function() {
                    google.script.host.close();
                })
                .withFailureHandler(function(error) {
                    messageDiv.textContent = 'Could not open dialog: ' + (error.message || error.toString());
                    messageDiv.style.display = 'block';
                    buttons.forEach(function(btn) {
                        btn.disabled = false;
                    });
                    button.innerHTML = originalText;
                })
                [functionName]();
        }
    </script>
</body>
</html>
